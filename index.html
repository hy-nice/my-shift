<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4389df"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Shift"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><link rel="stylesheet" href="style.css"><title>My Shift</title></head><body><main><header><div><small>MY SHIFT</small><h1>シフト作成ツール</h1></div><span class="pill">個人用</span></header><section class="panel"><div class="month"><button id="prev" aria-label="前の月">‹</button><strong id="monthLabel"></strong><button id="next" aria-label="次の月">›</button></div><div id="calendar" class="calendar"></div><p class="hint">日付をタップして選択・もう一度タップで解除</p><div class="toolbar"><strong id="selectedCount">0日選択中</strong><button id="clear" class="textbtn">選択解除</button></div></section><section class="panel"><h2>選択した日の勤務時間</h2><div class="times"><label>出勤<input id="start" type="time" value="09:00" step="900"></label><label>退勤<input id="end" type="time" value="18:00" step="900"></label></div><button id="apply" class="primary">選択した日に時間を適用</button><p class="hint">登録済みの日付も変更できます。</p><h3>よく使う時間</h3><div id="presets" class="presets"></div><button id="savePreset" class="outline">現在の時間を定型設定に保存</button></section><section class="panel"><h2>登録済みの勤務日 <span id="shiftCount"></span></h2><div id="shiftList" class="shiftlist"></div></section><section class="panel"><h2>LINE送信用メッセージ</h2><textarea id="preview" rows="10" readonly></textarea><div class="actions"><button id="copy" class="outline">文章をコピー</button><button id="share" class="primary">LINEで共有</button></div><p class="hint">共有メニューからLINEを選ぶか、文章をコピーしてトークに貼り付けてください。</p></section><footer>データはこの端末のブラウザに保存されます。ブラウザのデータを消去すると失われる場合があります。</footer></main><script src="app.js"></script></body></html>
